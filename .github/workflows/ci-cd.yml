name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  CLOUDFLARE_PAGES_PROJECT: siltda

jobs:
  frontend:
    name: Frontend / typecheck and static build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SILTDA_ML_API_URL: ${{ vars.NEXT_PUBLIC_SILTDA_ML_API_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate production API URL
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ML_API_URL: ${{ vars.NEXT_PUBLIC_SILTDA_ML_API_URL }}
        run: |
          case "$ML_API_URL" in
            https://*) ;;
            *) echo "NEXT_PUBLIC_SILTDA_ML_API_URL must be a non-empty HTTPS URL"; exit 1 ;;
          esac

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build static export
        run: npm run build

      - name: Upload production static export
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-out
          path: out
          if-no-files-found: error
          retention-days: 1

  backend:
    name: Backend / tests and model compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-serve.txt

      - name: Install pinned training and API dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run unit, API, and committed-model tests
        run: python -m pytest -q

  backend-container:
    name: Backend / production container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: siltda-ml-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-pages:
    name: Deploy / Cloudflare Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - frontend
      - backend
      - backend-container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: cloudflare-pages-production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Validate deployment configuration
        env:
          ML_API_URL: ${{ vars.NEXT_PUBLIC_SILTDA_ML_API_URL }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CF_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CF_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          case "$ML_API_URL" in
            https://*) ;;
            *) echo "NEXT_PUBLIC_SILTDA_ML_API_URL must be a non-empty HTTPS URL"; exit 1 ;;
          esac

      - name: Download verified static export
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-pages-out
          path: out

      - name: Deploy verified commit to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy out
            --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main
            --commit-hash=${{ github.sha }}
            --commit-dirty=false
